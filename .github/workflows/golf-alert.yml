name: golf-alert

on:
  schedule:
    - cron: "*/10 * * * *"  # 약 10분마다 (GitHub 사정에 따라 몇 분 늦을 수 있음)
  workflow_dispatch:  # Actions 화면에서 수동 실행

permissions:
  contents: write  # state.json / config.json 저장용

concurrency:
  group: golf-alert
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check tee times
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONIOENCODING: utf-8
        run: python golf_alert.py --cloud

      - name: Save state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json config.json
          if ! git diff --cached --quiet; then
            git commit -m "update state"
            git pull --rebase -X theirs
            git push
          fi
